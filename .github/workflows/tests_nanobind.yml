name: ducc-tests-nanobind
on: [workflow_dispatch]
env:
  DUCC0_USE_NANOBIND: 1

jobs:
  test-typing:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install --upgrade numpy==1.21.6 typing_extensions mypy pyright ty
      - run: python -m pip install .
      # nanobind compiled objects are not inspectable enough for useful stubtest comparison.
      - run: |
          cd /tmp
          python -m mypy --config-file "$GITHUB_WORKSPACE/mypy.ini" --warn-unused-ignores "$GITHUB_WORKSPACE/python/test/typing"
          python -m mypy --config-file "$GITHUB_WORKSPACE/mypy.ini" --warn-unused-ignores "$GITHUB_WORKSPACE/python/test/typing_nanobind.py"
          pyright --pythonpath "$(command -v python)" "$GITHUB_WORKSPACE/python/test/typing" "$GITHUB_WORKSPACE/python/test/typing_nanobind.py"
          ty check --python "$(command -v python)" "$GITHUB_WORKSPACE/python/test/typing" "$GITHUB_WORKSPACE/python/test/typing_nanobind.py"
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --user --upgrade pytest numpy scipy
      - run: DUCC0_OPTIMIZATION=portable python -m pip install --user -v .
      - run: python -m pytest python/test -x
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --user --upgrade pytest numpy scipy
      - run: python -m pip install --user -v .
      - run: python -m pytest python/test -x
  test-intel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --user --upgrade pytest scipy
      - run: wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      - run: sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      - run: sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
      - run: sudo apt update
      - run: sudo apt install intel-oneapi-compiler-dpcpp-cpp
      - run: |
          source /opt/intel/oneapi/setvars.sh intel64
          CC=icx CXX=icpx python3 -m pip install --user -v .
          python -m pytest python/test -x
