name: ducc-tests
on:
  workflow_dispatch:
    inputs:
      binding:
        description: Python binding
        type: choice
        required: true
        default: pybind11
        options:
          - pybind11
          - nanobind
          - both
      optimization:
        description: Optimization
        type: choice
        required: true
        default: native
        options:
          - native
          - portable
          - multiarch
          - all

jobs:
  test:
    if: inputs.optimization != 'multiarch'
    name: >-
      ${{ matrix.platform.os }} /
      ${{ matrix.platform.python || '3.11' }}${{ matrix.platform.compiler && format(' ({0})', matrix.platform.compiler) || '' }} /
      ${{ matrix.binding }} /
      ${{ matrix.optimization }}
    runs-on: ${{ matrix.platform.os }}
    env:
      DUCC0_OPTIMIZATION: ${{ matrix.optimization }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-24.04
            python: '3.8'
          - os: ubuntu-24.04
            python: '3.9'
          - os: ubuntu-24.04
            python: '3.10'
          - os: ubuntu-24.04
            python: '3.11'
          - os: ubuntu-24.04
            python: '3.12'
          - os: ubuntu-24.04
            python: '3.13'
          - os: ubuntu-24.04
            python: '3.14'
          - os: ubuntu-24.04
            python: '3.14t'
          - os: ubuntu-24.04
            python: '3.15'
          - os: ubuntu-24.04
            python: '3.15t'
          - os: ubuntu-24.04-arm
            python: '3.14t'
          - os: ubuntu-24.04-arm
            python: '3.15t'
          - os: macos-15-intel
            python: '3.14t'
          - os: macos-15-intel
            python: '3.15t'
          - os: macos-15
            python: '3.14t'
          - os: macos-15
            python: '3.15t'
          - os: windows-2025
            python: '3.14t'
          - os: windows-2025
            python: '3.15t'
          - os: windows-11-arm
            python: '3.14t'
          - os: windows-11-arm
            python: '3.15t'
          - os: ubuntu-22.04
          - os: ubuntu-24.04
            compiler: intel
          - os: ubuntu-24.04
            compiler: clang
          - os: ubuntu-26.04
          - os: ubuntu-22.04-arm
          - os: ubuntu-24.04-arm
          - os: ubuntu-26.04-arm
          - os: macos-15-intel
          - os: macos-26-intel
          - os: macos-15
          - os: macos-26
          - os: windows-2022
          - os: windows-2025
          - os: windows-11-arm
        binding: ${{ fromJSON(inputs.binding == 'both' && '["pybind11","nanobind"]' || format('["{0}"]', inputs.binding)) }}
        optimization: ${{ fromJSON(inputs.optimization == 'all' && '["native","portable"]' || format('["{0}"]', inputs.optimization)) }}
        exclude:
          - binding: nanobind
            optimization: portable

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.platform.python || '3.11' }}
          allow-prereleases: true

      - name: Verify free-threaded interpreter
        if: endsWith(matrix.platform.python, 't')
        run: python -c "import sysconfig; assert sysconfig.get_config_var('Py_GIL_DISABLED') == 1"

      - name: Install dependencies
        run: python -m pip install --user --upgrade pytest numpy scipy

      - name: Install Intel compiler
        if: matrix.platform.compiler == 'intel'
        run: |
          wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
          sudo apt update
          sudo apt install intel-oneapi-compiler-dpcpp-cpp

      - name: Build and install
        if: matrix.platform.compiler != 'intel' && matrix.platform.compiler != 'clang'
        shell: bash
        run: ${{ matrix.binding == 'nanobind' && 'DUCC0_USE_NANOBIND=1' || '' }} python -m pip install --user .

      - name: Build and install with Intel compiler
        if: matrix.platform.compiler == 'intel'
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh intel64
          echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH" >> "$GITHUB_ENV"
          ${{ matrix.binding == 'nanobind' && 'DUCC0_USE_NANOBIND=1' || '' }} CC=icx CXX=icpx python -m pip install --user .

      - name: Build and install with Clang
        if: matrix.platform.compiler == 'clang'
        shell: bash
        run: |
          clang --version
          ${{ matrix.binding == 'nanobind' && 'DUCC0_USE_NANOBIND=1' || '' }} CC=clang CXX=clang++ python -m pip install --user .

      - name: Verify binding
        run: python -c "import ducc0; assert ducc0.__wrapper__ == '${{ matrix.binding }}'; print(ducc0.__wrapper__)"

      - name: Run tests
        run: python -m pytest python/test -x

  test-multiarch:
    if: inputs.optimization == 'multiarch' || inputs.optimization == 'all'
    name: ubuntu-26.04 / 3.11 / ${{ matrix.binding }} / multiarch
    runs-on: ubuntu-26.04
    env:
      DUCC0_OPTIMIZATION: multiarch-strip
    strategy:
      fail-fast: false
      matrix:
        binding: ${{ fromJSON(inputs.binding == 'both' && '["pybind11","nanobind"]' || format('["{0}"]', inputs.binding)) }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --user --upgrade pytest numpy scipy

      - name: Build and install
        shell: bash
        run: ${{ matrix.binding == 'nanobind' && 'DUCC0_USE_NANOBIND=1' || '' }} python -m pip install --user .

      - name: Verify binding
        run: python -c "import ducc0; assert ducc0.__wrapper__ == '${{ matrix.binding }}'; print(ducc0.__wrapper__)"

      - name: Check multiarch support
        id: multiarch_support
        run: python python/test/check_multiarch.py --require-multiarch --write-github-output

      - name: Run x86-64-v1 tests
        env:
          DUCC0_MAX_PSABI_LEVEL: '1'
        run: |
          python python/test/check_multiarch.py --require-active-profile x86-64
          python -m pytest python/test -x

      - name: Run x86-64-v3 tests
        if: steps.multiarch_support.outputs.v3 == 'true'
        env:
          DUCC0_MAX_PSABI_LEVEL: '3'
        run: |
          python python/test/check_multiarch.py --require-active-profile x86-64-v3
          python -m pytest python/test -x

      - name: Run x86-64-v4 tests
        if: steps.multiarch_support.outputs.v4 == 'true'
        env:
          DUCC0_MAX_PSABI_LEVEL: '4'
        run: |
          python python/test/check_multiarch.py --require-active-profile x86-64-v4
          python -m pytest python/test -x

  test-pyodide:
    if: inputs.optimization == 'portable' || inputs.optimization == 'all'
    name: pyodide / 3.14 / ${{ matrix.binding }} / portable
    runs-on: ubuntu-26.04
    env:
      DUCC0_OPTIMIZATION: portable
    strategy:
      fail-fast: false
      matrix:
        binding: ${{ fromJSON(inputs.binding == 'both' && '["pybind11","nanobind"]' || format('["{0}"]', inputs.binding)) }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          allow-prereleases: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Build Pyodide wheel
        shell: bash
        run: |
          python -m pip install pyodide-build
          ${{ matrix.binding == 'nanobind' && 'DUCC0_USE_NANOBIND=1' || '' }} pyodide build .
          pyodide venv .venv-pyodide
          .venv-pyodide/bin/python -m pip install pytest numpy scipy
          .venv-pyodide/bin/python -m pip install dist/*.whl
          echo "$PWD/.venv-pyodide/bin" >> "$GITHUB_PATH"

      - name: Verify binding
        run: python -c "import ducc0; assert ducc0.__wrapper__ == '${{ matrix.binding }}'; print(ducc0.__wrapper__)"

      - name: Run tests
        run: python -m pytest python/test -x

  test-docker:
    if: inputs.optimization == 'portable' || inputs.optimization == 'all'
    name: i686 / 3.12 / ${{ matrix.binding }} / portable
    runs-on: ubuntu-24.04
    env:
      DUCC0_OPTIMIZATION: portable
    strategy:
      fail-fast: false
      matrix:
        binding: ${{ fromJSON(inputs.binding == 'both' && '["pybind11","nanobind"]' || format('["{0}"]', inputs.binding)) }}

    steps:
      - uses: actions/checkout@v7
      - name: Run i686 tests in Docker
        run: |
          set -euxo pipefail
          docker pull quay.io/pypa/manylinux_2_28_i686
          docker run --rm \
            --platform=linux/i386 \
            -e DUCC0_OPTIMIZATION \
            -v "$PWD:/ducc" \
            -w /ducc \
            quay.io/pypa/manylinux_2_28_i686 \
            /bin/bash -c '
              set -euxo pipefail
              python3.12 -m venv /tmp/venv
              source /tmp/venv/bin/activate
              python -m pip install --upgrade pip
              # FIXME: scikit-build-core limited to <1.1 for the moment, because otherwise CI breaks for Python 3.14t and 3.15t
              python -m pip install pytest "scikit-build-core<1.1" nanobind pybind11
              python -m pip install numpy==2.0.0 -Cbuild-dir=/tmp/numpy-builddir
              python -c "import struct; assert struct.calcsize(\"P\") == 4; print(\"pointer bits:\", struct.calcsize(\"P\")*8)"
              g++ --version
              DUCC0_CFLAGS="-march=i686 -msse2 -mfpmath=sse" \
                ${{ matrix.binding == 'nanobind' && 'DUCC0_USE_NANOBIND=1' || '' }} python -m pip install --no-build-isolation .
              python -c "import ducc0; assert ducc0.__wrapper__ == \"${{ matrix.binding }}\"; print(ducc0.__wrapper__)"
              python -m pytest python/test -x
            '
