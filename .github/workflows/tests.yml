name: ducc-tests
on: [workflow_dispatch]

jobs:
  test-native:
    name: ${{ matrix.platform }} / ${{ matrix.binding }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        platform: [macos, windows, intel, amd64, arm64]
        binding: [pybind11, nanobind]
        include:
          - platform: macos
            os: macos-15
            build_env: DUCC0_OPTIMIZATION=portable
          - platform: windows
            os: windows-2025
            build_env: ""
          - platform: intel
            os: ubuntu-24.04
            build_env: ""
          - platform: amd64
            os: ubuntu-24.04
            build_env: ""
          - platform: arm64
            os: ubuntu-24.04-arm
            build_env: ""
          - binding: pybind11
            binding_env: ""
          - binding: nanobind
            binding_env: DUCC0_USE_NANOBIND=1

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install --user --upgrade pytest numpy scipy

      - name: Install Intel compiler
        if: matrix.platform == 'intel'
        run: |
          wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
          sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
          sudo apt update
          sudo apt install intel-oneapi-compiler-dpcpp-cpp

      - name: Build and install
        if: matrix.platform != 'intel'
        shell: bash
        run: ${{ matrix.binding_env }} ${{ matrix.build_env }} python -m pip install --user .

      - name: Build and install with Intel compiler
        if: matrix.platform == 'intel'
        shell: bash
        run: |
          source /opt/intel/oneapi/setvars.sh intel64
          ${{ matrix.binding_env }} CC=icx CXX=icpx python -m pip install --user .

      - name: Verify binding
        run: python -c "import ducc0; assert ducc0.__wrapper__ == '${{ matrix.binding }}'; print(ducc0.__wrapper__)"

      - name: Run tests
        run: python -m pytest python/test -x

  test-i686:
    name: i686 / ${{ matrix.binding }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        binding: [pybind11, nanobind]
        include:
          - binding: pybind11
            binding_env: ""
          - binding: nanobind
            binding_env: DUCC0_USE_NANOBIND=1

    steps:
      - uses: actions/checkout@v7
      - name: Run i686 tests in Docker
        run: |
          set -euxo pipefail
          docker pull quay.io/pypa/manylinux_2_28_i686
          docker run --rm \
            --platform=linux/i386 \
            -v "$PWD:/ducc" \
            -w /ducc \
            quay.io/pypa/manylinux_2_28_i686 \
            /bin/bash -c '
              set -euxo pipefail
              python3.12 -m venv /tmp/venv
              source /tmp/venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install pytest scikit-build-core nanobind pybind11
              python -m pip install numpy==2.0.0 -Cbuild-dir=/tmp/numpy-builddir
              python -c "import struct; assert struct.calcsize(\"P\") == 4; print(\"pointer bits:\", struct.calcsize(\"P\")*8)"
              g++ --version
              DUCC0_OPTIMIZATION=portable \
                DUCC0_CFLAGS="-march=i686 -msse2 -mfpmath=sse" \
                ${{ matrix.binding_env }} python -m pip install --no-build-isolation .
              python -c "import ducc0; assert ducc0.__wrapper__ == \"${{ matrix.binding }}\"; print(ducc0.__wrapper__)"
              python -m pytest python/test -x
            '
