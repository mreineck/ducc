name: ducc-tests
on: [workflow_dispatch]
jobs:
  test-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --user --upgrade pytest numpy scipy
      - run: DUCC0_OPTIMIZATION=portable python -m pip install --user .
      - run: python -m pytest python/test -x
  test-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --user --upgrade pytest numpy scipy
      - run: python -m pip install --user .
      - run: python -m pytest python/test -x
  test-intel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --user --upgrade pytest scipy
      - run: wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      - run: sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
      - run: sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"
      - run: sudo apt update
      - run: sudo apt install intel-oneapi-compiler-dpcpp-cpp
      - run: |
          source /opt/intel/oneapi/setvars.sh intel64
          CC=icx CXX=icpx python3 -m pip install --user .
          python -m pytest python/test -x
  test-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --user --upgrade pytest numpy scipy
      - run: python -c "import platform; assert platform.machine() in ('aarch64', 'arm64'); print(platform.machine())"
      - run: python -m pip install --user .
      - run: python -m pytest python/test -x
  test-i686:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: |
          set -euxo pipefail
          docker pull quay.io/pypa/manylinux_2_28_i686
          docker run --rm \
            --platform=linux/i386 \
            -v "$PWD:/ducc" \
            -w /ducc \
            quay.io/pypa/manylinux_2_28_i686 \
            /bin/bash -c '
              set -euxo pipefail
              python3.12 -m venv /tmp/venv
              source /tmp/venv/bin/activate
              python -m pip install --upgrade pip
              python -m pip install pytest scikit-build-core nanobind pybind11
              python -m pip install numpy==2.0.0 -Cbuild-dir=/tmp/numpy-builddir
              python -c "import struct; assert struct.calcsize(\"P\") == 4; print(\"pointer bits:\", struct.calcsize(\"P\")*8)"
              g++ --version
              DUCC0_OPTIMIZATION=portable \
                DUCC0_CFLAGS="-march=i686 -msse2 -mfpmath=sse" \
                python -m pip install --no-build-isolation .
              python -m pytest python/test -x
            '